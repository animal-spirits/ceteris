name: pack-gate

# Nightly full-pack gate on the owner's Mac (pre-P3 D5). Never on pull requests: the pack lives
# only on that machine, and fork code must not reach it.
on:
  schedule:
    - cron: "0 9 * * *" # 03:00 US Central (CST)
  workflow_dispatch:

concurrency:
  group: pack-gate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  pack:
    runs-on: [self-hosted, macOS, ARM64, pack-gate]
    timeout-minutes: 360
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target/pack-gate
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/pack-gate.sh "$GITHUB_WORKSPACE/pack-gate-logs"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-gate-logs
          path: pack-gate-logs
          retention-days: 14
      - name: Disk cleanup
        if: always()
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"

  # G1 flatness gate (ADR 0234, #202): 100 years on the pack, single-thread CPU-time ratio of
  # years 96-100 to 1-5 must stay under 1.25. Runs after the pack job so the two do not
  # compete for the host; not a required check.
  flatness:
    needs: pack
    if: always()
    runs-on: [self-hosted, macOS, ARM64, pack-gate]
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target/pack-gate
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo bench -p ceteris-econ --bench flatness
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flatness-report
          path: tests/perf/flatness.md
          retention-days: 14
      - name: Disk cleanup
        if: always()
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"

  # Failure alert: one open issue, commented on each further failing night. Runs on a GitHub-hosted
  # runner so it still fires when the Mac is offline (a never-started job counts as failed).
  alert:
    needs: [pack, flatness]
    if: always() && (needs.pack.result != 'success' || needs.flatness.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the pack-gate issue
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="pack: ${{ needs.pack.result }}, flatness: ${{ needs.flatness.result }}. $run_url"
          n=$(gh issue list --state open --search 'in:title "pack-gate failing"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "pack-gate failing" --body "$body"
          fi
