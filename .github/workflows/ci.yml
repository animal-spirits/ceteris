name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["rfcs/**", "spec/**", "specs/**", "docs/**", "research/**", "**/*.md"]
  pull_request:
    paths-ignore: ["rfcs/**", "spec/**", "specs/**", "docs/**", "research/**", "**/*.md"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Pull requests, including forks, run only on GitHub-hosted runners. Push to main, nightly and
  # on-demand jobs run on the owner's self-hosted Mac (aarch64-darwin), which fork code never
  # reaches. Self-hosted target dirs sit outside the checkout so they survive the clean
  # checkout between runs; hosted runners use the default target dir, restored by rust-cache.
  rust:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","macOS","ARM64","ceteris"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Target dir outside the checkout (self-hosted)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../target/rust" >> "$GITHUB_ENV"
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # The workspace's debug test binaries filled the hosted runner's disk (ld bus error).
      - name: Free disk and shrink debug output (hosted)
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      # Golden drift fails here, before the slower lint and test steps; the later nextest run skips it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Stale-golden check
        run: cargo nextest run -p ceteris-core -p ceteris-econ -p ceteris-geo -E 'binary(golden)'
      - name: Data-source licence manifest and research pack profile (ADRs 0005, 0050)
        run: cargo run --release --bin ceteris -- pack check-sources --profile research
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Determinism bans still fire (ADR 0097)
        run: scripts/check_clippy_bans.sh
      - run: cargo deny check licenses
      - run: cargo nextest run --workspace --no-fail-fast -E 'not binary(golden)'
      - run: cargo test --workspace --doc
      - name: Determinism gate in optimized builds
        if: github.event_name == 'push'
        run: |
          cargo test -p ceteris-core --release --test golden --test p0_acceptance
          cargo test -p ceteris-econ --release --test golden --test p2_acceptance
      # The 20% regression gate needs a dedicated runner (ADR 0004).
      - name: Bench build
        if: github.event_name == 'push'
        run: cargo bench --workspace --no-run
      - name: Disk cleanup
        if: always() && runner.environment == 'self-hosted'
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, ceteris]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target/rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Pack-gated solver tests
        run: |
          cargo test -p ceteris-calibrate --test benchmark -- --ignored japan_loses_from_costlier_borders eu_loses_from_soft_brexit
          cargo test -p ceteris-econ --test p2_acceptance -- --ignored hundred_years_without_violation
      - name: Elasticity finite-difference tests (ADRs 0263, 0267)
        run: cargo test -p ceteris-calibrate --release --test steady_state -- --ignored own_price_elasticity_matches_finite_difference cross_price_elasticity_matches_finite_difference
      - name: Disk cleanup
        if: always()
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"

  # Gate commands from CLAUDE.md on main, nightly and on demand.
  gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, ceteris]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target/rust
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/check_clippy_bans.sh
      - run: cargo test --workspace
      - run: cargo run -p ceteris-rows -- check
      - run: |
          cargo test -p ceteris-core --release --test golden --test p0_acceptance
          cargo test -p ceteris-econ --release --test golden --test p2_acceptance
      - run: cargo run --release --bin ceteris -- pack check-sources --profile research
      - run: cargo deny check licenses
      - name: Disk cleanup
        if: always()
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"

  # Failures file one issue per day, so they notify the owner and stay on the board.
  report:
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [slow, gates]
    runs-on: [self-hosted, macOS, ARM64, ceteris]
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            const title = `Nightly CI failed ${day}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'ci',
            });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo, title, labels: ['ci'],
              body: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  app:
    if: github.event_name == 'push'
    runs-on: [self-hosted, macOS, ARM64, ceteris]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target/app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Disk cleanup
        if: always()
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"
