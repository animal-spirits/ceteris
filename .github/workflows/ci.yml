name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # Golden hashes must agree across architectures (Section 4.5).
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Data-source licence manifest and research pack profile (ADRs 0005, 0050)
        run: python3 -I python/ceteris/packs/check_sources.py --profile research
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Determinism bans still fire (ADR 0097)
        run: scripts/check_clippy_bans.sh
      - run: cargo test --workspace
      - name: Determinism gate in optimized builds
        run: |
          cargo test -p ceteris-core --release --test golden --test p0_acceptance
          cargo test -p ceteris-econ --release --test golden --test p2_acceptance
      # The 20% regression gate needs a dedicated runner (ADR 0004).
      - run: cargo bench --workspace --no-run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Pack-dependent tests skip: CI does not download the sources.
      - run: uv run --project python --locked pytest python/tests

  app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test
        working-directory: app/src-tauri
