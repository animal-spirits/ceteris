name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # Golden hashes must agree across architectures (Section 4.5).
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Data-source licence manifest (ADR 0005)
        run: python3 -I python/ceteris/packs/check_sources.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Determinism gate in optimized builds
        run: cargo test -p ceteris-core --release --test golden --test p0_acceptance
      # The 20% regression gate needs a dedicated runner (ADR 0004).
      - run: cargo bench --workspace --no-run
