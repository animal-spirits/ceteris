name: rows

# No paths-ignore: this is the check that spec, RFC and ADR-only PRs need.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rows:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"ubuntu-latest"' || '["self-hosted","macOS","ARM64","ceteris"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Target dir outside the checkout (self-hosted)
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../target/rows" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Agent branches stay out of owner-only paths
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claude/')
        run: |
          hits="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(\.github/|CODEOWNERS$)' || true)"
          if [ -n "$hits" ]; then
            echo "owner-only paths changed on an agent branch:"; echo "$hits"; exit 1
          fi
      - name: Registry, appendix, RFC numbers, research index, codes
        run: cargo run -p ceteris-rows -- check
      - run: cargo test -p ceteris-rows
      - name: Disk cleanup
        if: always() && runner.environment == 'self-hosted'
        run: "$GITHUB_WORKSPACE/scripts/ci-cleanup.sh"
