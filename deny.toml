[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9

# CC0-1.0 is a public-domain dedication. Reached through arrow-array -> ahash -> const-random.
exceptions = [{ allow = ["CC0-1.0"], crate = "tiny-keccak" }]
