# Maritime chokepoints (Section 5.3). Sea cells within radius_km of the centre are tagged with
# the chokepoint, so closing it (a shock) closes their edges. A `link` adds a sea edge along
# the given polyline where the H3 sea grid is too coarse to see the passage; `canal` links pay
# a transit fee.

[[chokepoint]]
name = "Suez Canal"
lon = 32.35
lat = 30.6
radius_km = 120
canal = true
link = [[32.30, 31.35], [32.33, 30.60], [32.55, 29.85], [33.60, 27.70], [34.10, 27.20]]

