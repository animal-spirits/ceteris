# Pack build configuration (Sections 5.1, 5.2, 21).

year = 2000

# H3 resolutions: base raster for provinces, and the sea grid of the transport graph.
land_res = 4
sea_res = 3
# County statistics are sampled on cells of this resolution (about 36 km², ADR 0009).
county_res = 6
# Sea zones are the sea grid's parents at this resolution (ADR 0007).
sea_zone_res = 1

# Provinces larger than this are split (ADR 0006).
split_area_km2 = 250_000

# Development slice for P1 to P3 (Section 21): European economies, 2000 vintage codes.
dev_slice = [
    "ALB", "AND", "AUT", "BEL", "BGR", "BIH", "BLR", "CHE", "CYP", "CZE", "DEU", "DNK",
    "ESP", "EST", "FIN", "FRA", "GBR", "GRC", "HRV", "HUN", "IRL", "ISL", "ITA", "KOS",
    "LIE", "LTU", "LUX", "LVA", "MCO", "MDA", "MKD", "MLT", "NLD", "NOR", "POL", "PRT",
    "ROU", "SMR", "SVK", "SVN", "SWE", "UKR", "VAT", "YUG",
]
