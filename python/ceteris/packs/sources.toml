# Data-source licence manifest (Sections 2.5, 16, 22; ADR 0005).
#
# One entry per source the pipeline may read. Licences were checked on the provider's own
# page or repository record on the `checked` date; research, not legal advice.
#
#   use     primary | complement | fallback | validation | rejected
#   policy  what a public release may do: bundle | bundle-aggregates | fetch | exclude
#   closed_source_only = true marks sources usable only while nothing is distributed
#   (non-commercial, no licence stated, or permission needed). They must be replaced or
#   cleared before `distribution` becomes "open"; check_sources.py enforces this.
#
# Validate: python3 -I python/ceteris/packs/check_sources.py

[project]
distribution = "closed"

