[project]
name = "ceteris"
version = "0.0.1"
description = "Data pipeline, reference model and analysis for Ceteris Paribus"
requires-python = ">=3.12"
dependencies = [
    "h3>=4.2",
    "mapbox-earcut>=2.1.0",
    "numpy>=2.1",
    "pyarrow>=18",
    "pyogrio>=0.10",
    "rasterio>=1.4",
    "scipy>=1.18.1",
    "shapely>=2.1",
]

[project.optional-dependencies]
# exact-derivative calibration solver (`ceteris.reference.jax_model`); CPU wheels, not needed by CI
jax = ["jax==0.12.0.1", "jaxlib==0.12.0.1"]

[dependency-groups]
dev = ["hypothesis>=6.120", "pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint.isort]
known-first-party = ["ceteris"]
