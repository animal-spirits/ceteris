[package]
name = "ceteris-econ"
description = "Production, labour, demand and the monthly economic tick for Ceteris Paribus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "60.0.0"
arrow-ipc = { version = "60.0.0", features = ["zstd"] }
arrow-schema = "60.0.0"
ceteris-core = { path = "../ceteris-core" }
ceteris-geo = { path = "../ceteris-geo" }
ceteris-run = { path = "../ceteris-run" }
ceteris-trade = { path = "../ceteris-trade" }
libm = "0.2.16"
rayon = "1.12.0"

[dev-dependencies]
mimalloc = { version = "0.1.52", default-features = false }
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "econ"
harness = false

[[bench]]
name = "trade"
harness = false

[[bench]]
name = "flatness"
harness = false

[[bench]]
name = "goods"
harness = false

[[bench]]
name = "pop"
harness = false
