reason = "OECD terms, section 3 (Data): except where additional restrictions apply, data may be extracted, downloaded, copied, adapted, printed, distributed, shared and embedded for any purpose, even for commercial use, with credit to the OECD. The BTiGE ReadMe (https://webfs-sti.oecd.org/files/STI-PIE/BTIGE/OECD-Bilateral-Trade-in-Goods-End-use-ReadMe.xlsx) says the trade flows are mapped using a correspondence table developed by the OECD. The file on webfs-sti.oecd.org answers a plain scripted request (the dataset page itself is 403 to scripts)."
