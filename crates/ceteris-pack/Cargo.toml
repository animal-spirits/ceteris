[package]
name = "ceteris-pack"
description = "Pack tables, Arrow output and the parity comparison for Ceteris Paribus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "60.0.0"
arrow-cast = "60.0.0"
arrow-ipc = { version = "60.0.0", features = ["zstd"] }
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
calamine = "0.37.0"
csv = "1.4.0"
earcut = "0.4.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
# Without default features: they would turn on rayon in i_overlay. spade: MakeValid.
geo = { version = "0.33.1", default-features = false, features = ["spade"] }
# Owner-side only: links the LGPL GEOS C library dynamically.
geos = { version = "11.3.1", optional = true, features = ["v3_15_0"] }
h3o = { version = "=0.11.0", features = ["geo"] }
icu_casemap = "2.4.0"
icu_normalizer = "2.4.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
rstar = "0.12.2"
# float_roundtrip: coordinates parse to the nearest double, as GDAL reads them.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10.9"
tiff = { version = "0.11.3", default-features = false }
toml = "1.1.8"
weezl = "0.1.12"
# Without default features: they would add the bzip2 and zstd C codecs; the cache needs deflate only.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
# Polygon overlay through GEOS, for the owner-side geo build (owner decision 7).
geos = ["dep:geos"]

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
