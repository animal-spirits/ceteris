[package]
name = "ceteris-pack"
description = "Pack tables, Arrow output and the parity comparison for Ceteris Paribus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "60.0.0"
arrow-cast = "60.0.0"
arrow-ipc = { version = "60.0.0", features = ["zstd"] }
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
calamine = "0.37.0"
csv = "1.4.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.10.9"
toml = "1.1.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
