[package]
name = "ceteris-geos-coverage"
description = "GEOS coverage simplification for the owner-side map build of Ceteris Paribus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Not the workspace lints: the one FFI call needs unsafe, which the workspace forbids. Allowed
# only on that function.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
float_arithmetic = "allow"

[dependencies]
# Owner-side only: links the LGPL GEOS C library dynamically.
# The version features are cumulative, as the geos crate's v3_15_0 enables them.
geos-sys = { version = "2.0.10", optional = true, features = [
    "v3_7_0",
    "v3_8_0",
    "v3_9_0",
    "v3_10_0",
    "v3_11_0",
    "v3_12_0",
    "v3_13_0",
    "v3_14_0",
    "v3_15_0",
] }

[features]
geos = ["dep:geos-sys"]
