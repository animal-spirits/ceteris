[package]
name = "ceteris-reference"
description = "Independent reference model of the Ceteris Paribus economy, written from the spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "60.0.0"
arrow-cast = "60.0.0"
arrow-ipc = { version = "60.0.0", features = ["zstd"] }
arrow-schema = "60.0.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
statrs = { version = "0.19.1", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
