[package]
name = "ceteris-cli"
description = "The ceteris command line: export, run and pack tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ceteris-calibrate = { path = "../ceteris-calibrate" }
ceteris-core = { path = "../ceteris-core" }
ceteris-econ = { path = "../ceteris-econ" }
ceteris-geo = { path = "../ceteris-geo" }
ceteris-pack = { path = "../ceteris-pack" }
ceteris-reference = { path = "../ceteris-reference" }
ceteris-trade = { path = "../ceteris-trade" }
mimalloc = { version = "0.1.52", default-features = false }
tempfile = "3.27.0"

[features]
# The owner-side geo build: province splitting and county clipping through GEOS.
geos = ["ceteris-pack/geos"]

[[bin]]
name = "ceteris"
path = "src/main.rs"

[dev-dependencies]
arrow-array = "60.0.0"
arrow-cast = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
serde_json = "1.0.154"
sha2 = "0.10.9"
