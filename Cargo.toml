[workspace]
resolver = "3"
members = ["crates/*", "tools/rows"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "allow"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1

# Solver tests run the full economy; opt-level 1 cuts their run time about 6x on the pack
# (measured on block_tick, steady_state, p2_*) at a lower build cost than opt-level 3.
[profile.test]
opt-level = 1
