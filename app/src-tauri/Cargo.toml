[package]
name = "ceteris-app"
description = "Ceteris Paribus desktop app: the Rust core in-process behind the map (Section 22.1)"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

# Its own workspace: Tauri's system dependencies stay out of the core's CI and lockfile.
[workspace]

[lib]
name = "ceteris_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ceteris-geo = { path = "../../crates/ceteris-geo" }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
